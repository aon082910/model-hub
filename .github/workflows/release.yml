name: release

# Tag a commit and the image that CA users pull is built from exactly that commit.
# Without this the published image is whatever someone last built by hand, and it
# drifts from the source silently.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to publish, e.g. 1.0.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Work out the version
        id: v
        run: |
          if [ -n "${{ inputs.tag }}" ]; then v="${{ inputs.tag }}"; else v="${GITHUB_REF_NAME#v}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "publishing $v"

      # Fail early and clearly if the registry credentials were never added,
      # rather than after a ten minute build.
      - name: Check Docker Hub credentials exist
        run: |
          if [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "::error::DOCKERHUB_TOKEN is not set. Add a repository secret named exactly DOCKERHUB_TOKEN (Settings > Secrets and variables > Actions) holding a Docker Hub access token with Read and Write permission."
            exit 1
          fi

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || 'allornothing' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Unraid is x86_64 only, so arm64 would be build time spent for zero users.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
          tags: |
            allornothing/model-hub:latest
            allornothing/model-hub:${{ steps.v.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.v.outputs.version }}" \
            --title "v${{ steps.v.outputs.version }}" \
            --generate-notes \
            --notes-start-tag "$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo '')" \
            || gh release edit "v${{ steps.v.outputs.version }}" --draft=false
